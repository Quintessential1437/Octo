<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squid Head AR</title>
<style>
:root{--bg:#0b1220;--fg:#ffeef2;--accent:#ff8fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#ffeef2}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:rgba(8,12,24,.85)}
#ui h1{margin:0;font-size:26px}
#ui p{margin:0;max-width:320px;opacity:.85;font-size:15px;line-height:1.4}
button{background:var(--accent);color:#2a0a18;border:0;border-radius:999px;padding:14px 26px;font-size:16px;font-weight:700}
button.ghost{background:transparent;color:var(--fg);border:1px solid #ffffff44}
#hud{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;opacity:.9;pointer-events:none;text-shadow:0 1px 4px #000}
#tag{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;font-size:12px;background:#0008;color:#fff;padding:4px 8px;border-radius:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag" style="display:none"></div>
<div id="hud"></div>
<div id="ui">
  <h1>🦑 Squid Hat</h1>
  <p>A detailed squid rides on your head: its mantle sways, its fins flutter, and its arms and two long feeding tentacles swing as you move. Use the front camera and keep your face in view.</p>
  <button id="go">Start camera</button>
  <button id="demo" class="ghost">No camera: drag the head</button>
</div>
<video id="v" playsinline muted style="display:none"></video>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),vid=document.getElementById('v');
const ui=document.getElementById('ui'),hud=document.getElementById('hud'),tagEl=document.getElementById('tag');
let W=0,H=0,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function tag(t){tagEl.style.display='block';tagEl.textContent=t}

const NT=10,NS=18;
const tents=[];
for(let i=0;i<8;i++)tents.push({t:-0.55+1.1*i/7,feed:false,len:1.05,p:[]});
tents.push({t:-0.16,feed:true,len:2.1,p:[]},{t:0.16,feed:true,len:2.1,p:[]});
const KEYS=['top','chin','l','r'];
const tgt={},sm={};
let headOk=false,fresh=true,mode='none',fit=null,t0=performance.now(),prevM=null,look={x:0,y:0},sway=0,swayV=0;

function setHead(top,chin,l,r){tgt.top=top;tgt.chin=chin;tgt.l=l;tgt.r=r;headOk=true}

function geom(){
  for(const k of KEYS){
    if(!sm[k]||fresh)sm[k]={x:tgt[k].x,y:tgt[k].y};
    else{sm[k].x+=(tgt[k].x-sm[k].x)*0.5;sm[k].y+=(tgt[k].y-sm[k].y)*0.5}
  }
  const {top,chin,l,r}=sm;
  let ux=top.x-chin.x,uy=top.y-chin.y;const ul=Math.hypot(ux,uy)||1;ux/=ul;uy/=ul;
  let rx=-uy,ry=ux;if(rx*(r.x-l.x)+ry*(r.y-l.y)<0){rx=-rx;ry=-ry}
  const fw=Math.max(40,Math.hypot(r.x-l.x,r.y-l.y));
  return{top,chin,u:{x:ux,y:uy},r:{x:rx,y:ry},fw,c:{x:(top.x+chin.x)/2,y:(top.y+chin.y)/2}};
}
const anchorOf=(g,t)=>({x:g.top.x-g.u.x*0.04*g.fw+g.r.x*t*0.55*g.fw,y:g.top.y-g.u.y*0.04*g.fw+g.r.y*t*0.55*g.fw});

function resetTents(g){
  for(const T of tents){
    const a=anchorOf(g,T.t),seg=T.len*g.fw/(NS-1);T.p=[];
    for(let j=0;j<NS;j++)T.p.push({x:a.x,y:a.y+seg*j,px:a.x,py:a.y+seg*j});
  }
}

function stepTents(g,dt,time){
  const G=g.fw*9,A=0.6*g.fw,B=0.72*g.fw;
  tents.forEach((T,i)=>{
    const seg=T.len*g.fw/(NS-1),P=T.p,a=anchorOf(g,T.t),amp=T.feed?2.4:1;
    for(let j=1;j<NS;j++){
      const p=P[j],vx=(p.x-p.px)*0.978,vy=(p.y-p.py)*0.978;
      p.px=p.x;p.py=p.y;
      const f=j/NS,wig=Math.sin(time*0.004+i*0.9+j*0.4)*g.fw*0.0026*f*amp;
      p.x+=vx+wig+T.t*g.fw*0.0012*f;p.y+=vy+G*dt*dt;
    }
    for(let it=0;it<12;it++){
      P[0].x=a.x;P[0].y=a.y;
      for(let j=0;j<NS-1;j++){
        const p=P[j],q=P[j+1];let dx=q.x-p.x,dy=q.y-p.y;const d=Math.hypot(dx,dy)||0.001,df=(d-seg)/d;
        if(j===0){q.x-=dx*df;q.y-=dy*df}else{p.x+=dx*df*.5;p.y+=dy*df*.5;q.x-=dx*df*.5;q.y-=dy*df*.5}
      }
      for(let j=1;j<NS;j++){
        const p=P[j],dx=p.x-g.c.x,dy=p.y-g.c.y;
        let lx=(dx*g.r.x+dy*g.r.y)/A,ly=(dx*g.u.x+dy*g.u.y)/B;
        const len=Math.hypot(lx,ly);
        if(len<1){const s=1.03/(len||0.001);if(!len){lx=T.t>=0?1:-1;ly=0}else{lx*=s;ly*=s}
          p.x=g.c.x+g.r.x*lx*A+g.u.x*ly*B;p.y=g.c.y+g.r.y*lx*A+g.u.y*ly*B}
      }
    }
    P[0].x=a.x;P[0].y=a.y;
  });
}

function drawTents(g){
  ctx.lineCap='round';ctx.lineJoin='round';
  const wAt=(T,j)=>{
    if(!T.feed)return g.fw*(0.18*Math.pow(1-j/(NS-1),0.8)+0.04);
    const u=(j-NS*0.68)/(NS*0.32);
    return g.fw*(0.055+(u>0?0.12*Math.sin(Math.PI*0.8*Math.min(1,u)):0));
  };
  const order=tents.slice().sort((a,b)=>(a.feed?1:0)-(b.feed?1:0));
  for(const T of order){
    const P=T.p;
    for(let j=0;j<NS-1;j++){
      ctx.strokeStyle='#4a0f2c';ctx.lineWidth=(wAt(T,j)+wAt(T,j+1))/2+g.fw*0.022;
      ctx.beginPath();ctx.moveTo(P[j].x,P[j].y);ctx.lineTo(P[j+1].x,P[j+1].y);ctx.stroke();
    }
    for(let j=0;j<NS-1;j++){
      const s=j/(NS-1);
      ctx.strokeStyle=`hsl(345,${60-12*s}%,${36+24*s}%)`;ctx.lineWidth=(wAt(T,j)+wAt(T,j+1))/2;
      ctx.beginPath();ctx.moveTo(P[j].x,P[j].y);ctx.lineTo(P[j+1].x,P[j+1].y);ctx.stroke();
      // lighter underside sheen
      ctx.strokeStyle='rgba(255,190,205,.22)';ctx.lineWidth=wAt(T,j)*0.25;
      ctx.beginPath();ctx.moveTo(P[j].x,P[j].y);ctx.lineTo(P[j+1].x,P[j+1].y);ctx.stroke();
    }
    // suckers
    for(let j=2;j<NS-1;j++){
      if(T.feed&&j<NS*0.68)continue;
      let dx=P[j+1].x-P[j-1].x,dy=P[j+1].y-P[j-1].y;const l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,w=wAt(T,j);
      const sides=T.feed?[-1,1]:[T.t<0?1:-1];
      for(const s of sides){
        const cx=P[j].x+nx*s*w*0.22,cy=P[j].y+ny*s*w*0.22,r=w*(T.feed?0.2:0.24);
        ctx.fillStyle='rgba(255,226,234,.9)';ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.fill();
        ctx.fillStyle='rgba(120,30,60,.7)';ctx.beginPath();ctx.arc(cx,cy,r*0.45,0,6.283);ctx.fill();
      }
    }
  }
}

// deterministic chromatophore spots on the mantle
const spots=[];
(function(){let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<110;i++){const y=-0.08-rnd()*1.4,hw=Math.max(0.03,0.40*(1-Math.pow((-y-0.35)/1.3,2)*0.85));
    spots.push({x:(rnd()*2-1)*hw*0.92,y,r:0.01+rnd()*0.028,ph:rnd()*6.28})}
})();

function drawSquid(g,time){
  const fw=g.fw,B={x:g.top.x+g.u.x*0.02*fw,y:g.top.y+g.u.y*0.02*fw};
  if(prevM){look.x+=((B.x-prevM.x)-look.x)*0.2;look.y+=((B.y-prevM.y)-look.y)*0.2}
  prevM=B;
  const target=-Math.max(-0.55,Math.min(0.55,look.x*0.02));
  swayV=swayV*0.86+(target-sway)*0.1;sway+=swayV;
  ctx.save();ctx.translate(B.x,B.y);ctx.rotate(Math.atan2(g.u.x,-g.u.y));ctx.scale(fw,fw);
  const lk=Math.max(-1,Math.min(1,look.x*0.12)),lv=Math.max(-1,Math.min(1,look.y*0.12));
  // head
  const hg=ctx.createLinearGradient(0,-0.15,0,0.25);hg.addColorStop(0,'#c0546e');hg.addColorStop(1,'#7a2342');
  ctx.fillStyle=hg;ctx.strokeStyle='#4a0f2c';ctx.lineWidth=0.02;
  ctx.beginPath();ctx.ellipse(0,0.05,0.34,0.19,0,0,6.283);ctx.fill();ctx.stroke();
  // mantle + fins swing with a spring
  ctx.save();ctx.rotate(sway);
  const mantle=()=>{ctx.beginPath();ctx.moveTo(-0.34,0.06);ctx.bezierCurveTo(-0.47,-0.25,-0.40,-0.8,0,-1.55);ctx.bezierCurveTo(0.40,-0.8,0.47,-0.25,0.34,0.06);ctx.closePath()};
  // fins
  for(const s of [-1,1]){
    ctx.save();ctx.translate(0,-1.25);ctx.rotate(s*Math.sin(time*0.007+s)*0.07);ctx.translate(0,1.25);
    const fg=ctx.createLinearGradient(0,0,s*0.65,0);fg.addColorStop(0,'rgba(214,88,107,.95)');fg.addColorStop(1,'rgba(255,190,205,.55)');
    ctx.fillStyle=fg;ctx.strokeStyle='#6e1636';ctx.lineWidth=0.016;
    ctx.beginPath();ctx.moveTo(s*0.1,-0.92);ctx.bezierCurveTo(s*0.4,-0.96,s*0.68,-1.06,s*0.63,-1.22);ctx.bezierCurveTo(s*0.5,-1.4,s*0.3,-1.52,s*0.04,-1.62);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(110,22,54,.28)';ctx.lineWidth=0.008;
    for(let k=0;k<6;k++){ctx.beginPath();ctx.moveTo(s*0.07,-0.98-k*0.1);ctx.quadraticCurveTo(s*0.35,-1.02-k*0.07,s*(0.6-0.04*Math.abs(k-2)),-1.1-k*0.075);ctx.stroke()}
    ctx.restore();
  }
  // mantle body
  ctx.save();ctx.shadowColor='rgba(255,110,150,.45)';ctx.shadowBlur=16;
  const mg=ctx.createLinearGradient(-0.45,0,0.45,0);
  mg.addColorStop(0,'#6e1636');mg.addColorStop(.25,'#d6586b');mg.addColorStop(.5,'#ff9bb0');mg.addColorStop(.75,'#d6586b');mg.addColorStop(1,'#6e1636');
  ctx.fillStyle=mg;mantle();ctx.fill();ctx.restore();
  ctx.save();mantle();ctx.clip();
  const vg=ctx.createLinearGradient(0,0,0,-1.55);vg.addColorStop(0,'rgba(255,210,220,.0)');vg.addColorStop(.6,'rgba(120,20,60,.12)');vg.addColorStop(1,'rgba(60,8,40,.5)');
  ctx.fillStyle=vg;ctx.fillRect(-0.6,-1.7,1.2,1.8);
  // banding
  ctx.strokeStyle='rgba(80,10,40,.16)';ctx.lineWidth=0.012;
  for(let k=0;k<8;k++){const y=-0.15-k*0.17;ctx.beginPath();ctx.moveTo(-0.5,y);ctx.quadraticCurveTo(0,y-0.07,0.5,y);ctx.stroke()}
  // spine highlight
  const sg=ctx.createLinearGradient(0,0,0,-1.5);sg.addColorStop(0,'rgba(255,235,240,.45)');sg.addColorStop(1,'rgba(255,235,240,0)');
  ctx.strokeStyle=sg;ctx.lineWidth=0.05;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-1.5);ctx.stroke();
  // chromatophores pulse
  for(const p of spots){
    ctx.fillStyle=`rgba(86,16,48,${0.3+0.22*Math.sin(time*0.003+p.ph)})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+0.15*Math.sin(time*0.004+p.ph)),0,6.283);ctx.fill();
  }
  // gloss
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-0.17,-0.5,0.03,0.3,0.12,0,6.283);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#4a0f2c';ctx.lineWidth=0.02;mantle();ctx.stroke();
  ctx.restore();
  // eyes
  for(const s of [-1,1]){
    const ex=s*0.3,ey=0.07,r=0.135;
    ctx.fillStyle='#2a0a18';ctx.beginPath();ctx.arc(ex,ey,r+0.018,0,6.283);ctx.fill();
    const ig=ctx.createRadialGradient(ex,ey,0.01,ex,ey,r);ig.addColorStop(0,'#fff6bf');ig.addColorStop(.55,'#e8b030');ig.addColorStop(1,'#8a5a10');
    ctx.fillStyle=ig;ctx.beginPath();ctx.arc(ex,ey,r,0,6.283);ctx.fill();
    ctx.fillStyle='#050005';ctx.beginPath();ctx.ellipse(ex+lk*0.03,ey+lv*0.03,0.095,0.032,0,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(60,20,0,.45)';ctx.lineWidth=0.012;ctx.beginPath();ctx.arc(ex,ey,r*0.78,0,6.283);ctx.stroke();
    ctx.strokeStyle='rgba(30,5,20,.55)';ctx.lineWidth=0.02;ctx.beginPath();ctx.arc(ex,ey,r,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(ex-0.045,ey-0.05,0.024,0,6.283);ctx.fill();
    ctx.beginPath();ctx.arc(ex+0.04,ey+0.04,0.011,0,6.283);ctx.fill();
  }
  ctx.restore();
}

function drawVideo(){
  const vw=vid.videoWidth,vh=vid.videoHeight;if(!vw)return null;
  const s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s,ox=(W-dw)/2,oy=(H-dh)/2;
  ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(vid,ox,oy,dw,dh);ctx.restore();
  return{s,dw,dh,ox,oy};
}
function grid(){ctx.fillStyle='#0b1220';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff10';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}

let wasOk=false;
function loop(now){
  const dt=Math.min(0.033,(now-t0)/1000||0.016);t0=now;
  if(mode==='cam')fit=drawVideo()||fit;else grid();
  if(mode==='demo'&&headOk){ // placeholder face
    ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;const fw=Math.min(W,H)*0.3;
    ctx.beginPath();ctx.ellipse((tgt.top.x+tgt.chin.x)/2,(tgt.top.y+tgt.chin.y)/2,fw*0.6,fw*0.72,0,0,6.283);ctx.stroke();
  }
  if(mode!=='none'){
    if(headOk){
      if(!wasOk)fresh=true;
      const g=geom();
      if(fresh){resetTents(g);prevM=null;fresh=false}
      stepTents(g,dt/2,now);stepTents(g,dt/2,now);
      drawTents(g);drawSquid(g,now);
      hud.textContent=mode==='cam'?'Shake, nod and tilt your head 🦑':'Drag to move the head';
    }else hud.textContent=mode==='cam'?'Show your face to the camera':'';
    wasOk=headOk;
  }
  requestAnimationFrame(loop);
}

// ---- Demo (touch) mode ----
function startDemo(){
  mode='demo';ui.style.display='none';tag('Demo mode');
  const fw=Math.min(W,H)*0.3;let cx=W/2,cy=H*0.55;
  const put=()=>setHead({x:cx,y:cy-fw*0.72},{x:cx,y:cy+fw*0.72},{x:cx-fw*0.5,y:cy},{x:cx+fw*0.5,y:cy});
  put();
  let down=false;
  cv.addEventListener('pointerdown',e=>{down=true;cx=e.clientX;cy=e.clientY;put()});
  cv.addEventListener('pointermove',e=>{if(down){cx=e.clientX;cy=e.clientY;put()}});
  addEventListener('pointerup',()=>down=false);
}

// ---- Camera + face tracking ----
const BASE='https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/';
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)});
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);

async function startCam(){
  const btn=document.getElementById('go');btn.textContent='Starting…';btn.disabled=true;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:720}},audio:false});
    vid.srcObject=stream;await vid.play();
    mode='cam';ui.style.display='none';hud.textContent='Loading face tracker…';
    let fm=null;
    try{
      await withTimeout(loadScript(BASE+'face_mesh.js'),6000);
      fm=new FaceMesh({locateFile:f=>BASE+f});
      fm.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
      fm.onResults(r=>{
        const L=r.multiFaceLandmarks&&r.multiFaceLandmarks[0];
        if(!L||!fit){headOk=false;return}
        const m=i=>({x:W-(L[i].x*fit.dw+fit.ox),y:L[i].y*fit.dh+fit.oy});
        setHead(m(10),m(152),m(234),m(454));
      });
      await withTimeout(fm.initialize(),12000);
    }catch(e){fm=null}
    if(!fm){tag('Backup tracker (face model failed to load)');startSkin();return}
    tag('Full face tracking');
    let busy=false;
    const pump=async()=>{
      if(!busy&&vid.readyState>=2){busy=true;try{await fm.send({image:vid})}catch(e){}busy=false}
      requestAnimationFrame(pump);
    };
    pump();
  }catch(err){
    mode='none';ui.style.display='flex';btn.disabled=false;btn.textContent='Retry camera';
    ui.querySelector('p').textContent=(!navigator.mediaDevices?'This page isn’t allowed to use the camera API here.':(err&&err.name==='NotAllowedError')?'Camera access was blocked. Either you tapped Block, or this embedded page isn’t permitted to ask for the camera.':'Camera error ('+((err&&err.name)||'unknown')+').')+' If it keeps happening, host the file on your own HTTPS site (e.g. GitHub Pages), or use the no-camera mode.';
    if(vid.srcObject)vid.srcObject.getTracks().forEach(t=>t.stop());
  }
}

// Backup: largest skin-colored blob = head (no model needed, less precise)
function startSkin(){
  const sw=96,sh=72,sc=document.createElement('canvas');sc.width=sw;sc.height=sh;
  const sx=sc.getContext('2d',{willReadFrequently:true});
  const lab=new Uint8Array(sw*sh),stk=new Int32Array(sw*sh);
  (function tick(){
    if(vid.readyState>=2&&fit){
      sx.drawImage(vid,0,0,sw,sh);const d=sx.getImageData(0,0,sw,sh).data,m=new Uint8Array(sw*sh);
      for(let i=0;i<sw*sh;i++){
        const R=d[i*4],G=d[i*4+1],B=d[i*4+2],cb=128-.1687*R-.3313*G+.5*B,cr=128+.5*R-.4187*G-.0813*B,y=.299*R+.587*G+.114*B;
        m[i]=(y>50&&cb>=77&&cb<=127&&cr>=133&&cr<=173)?1:0;
      }
      lab.fill(0);let best=null;
      for(let s=0;s<sw*sh;s++){
        if(!m[s]||lab[s])continue;
        let sp=0;stk[sp++]=s;lab[s]=1;const b={a:0,x0:sw,x1:0,y0:sh};
        while(sp){
          const p=stk[--sp],px=p%sw,py=(p/sw)|0;b.a++;
          if(px<b.x0)b.x0=px;if(px>b.x1)b.x1=px;if(py<b.y0)b.y0=py;
          if(px>0&&m[p-1]&&!lab[p-1]){lab[p-1]=1;stk[sp++]=p-1}
          if(px<sw-1&&m[p+1]&&!lab[p+1]){lab[p+1]=1;stk[sp++]=p+1}
          if(py>0&&m[p-sw]&&!lab[p-sw]){lab[p-sw]=1;stk[sp++]=p-sw}
          if(py<sh-1&&m[p+sw]&&!lab[p+sw]){lab[p+sw]=1;stk[sp++]=p+sw}
        }
        if(!best||b.a>best.a)best=b;
      }
      if(best&&best.a>sw*sh*0.03){
        const w=best.x1-best.x0,cx=(best.x0+best.x1)/2,chinY=best.y0+1.35*w,midY=(best.y0+chinY)/2;
        const S=(x,y)=>({x:W-(x/sw*fit.dw+fit.ox),y:y/sh*fit.dh+fit.oy});
        setHead(S(cx,best.y0),S(cx,chinY),S(best.x0,midY),S(best.x1,midY));
      }else headOk=false;
    }
    requestAnimationFrame(tick);
  })();
}

document.getElementById('go').onclick=startCam;
document.getElementById('demo').onclick=startDemo;
requestAnimationFrame(loop);
</script>
